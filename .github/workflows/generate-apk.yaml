name: Generate APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: generate-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_apk:
    name: Build and Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle && cp .github/gradle-ci.properties ~/.gradle/gradle.properties

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare release keystore
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          mkdir -p app/keystore
          if [ -n "$ANDROID_RELEASE_KEYSTORE_B64" ]; then
            echo "$ANDROID_RELEASE_KEYSTORE_B64" | base64 --decode > app/keystore/release.jks
            echo "ANDROID_RELEASE_KEYSTORE_PATH=$(pwd)/app/keystore/release.jks" >> "$GITHUB_ENV"
            echo "ANDROID_RELEASE_STORE_PASSWORD=$ANDROID_RELEASE_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_RELEASE_KEY_ALIAS=$ANDROID_RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_RELEASE_KEY_PASSWORD=$ANDROID_RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"
          fi

      - name: Build APKs
        run: ./gradlew :app:assembleOssRelease :app:assemblePlayRelease :app:assembleOssDebug :app:assemblePlayDebug

      - name: Stage APKs for distribution
        run: |
          mkdir -p release-apks
          cp app/build/outputs/apk/oss/release/app-oss-release.apk release-apks/Scrolless-OSS-Release.apk
          cp app/build/outputs/apk/play/release/app-play-release.apk release-apks/Scrolless-Play-Release.apk
          cp app/build/outputs/apk/oss/debug/app-oss-debug.apk release-apks/Scrolless-OSS-Debug.apk
          cp app/build/outputs/apk/play/debug/app-play-debug.apk release-apks/Scrolless-Play-Debug.apk

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Scrolless-APKs
          path: release-apks/*.apk
          retention-days: 30

      - name: Publish GitHub Release with APKs
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest-build' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest Automated Build' }}
          body: |
            Automated APK build from commit ${{ github.sha }} on `${{ github.ref_name }}`.
            
            ### Direct Download (Release - Recommended):
            - **[Scrolless-OSS-Release.apk](https://github.com/${{ github.repository }}/releases/download/${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest-build' }}/Scrolless-OSS-Release.apk)** (Signed Release - Recommended for phone installation)
            - **[Scrolless-Play-Release.apk](https://github.com/${{ github.repository }}/releases/download/${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest-build' }}/Scrolless-Play-Release.apk)** (Play store release flavor)

            ### Debug Builds:
            - **[Scrolless-OSS-Debug.apk](https://github.com/${{ github.repository }}/releases/download/${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest-build' }}/Scrolless-OSS-Debug.apk)**
            - **[Scrolless-Play-Debug.apk](https://github.com/${{ github.repository }}/releases/download/${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest-build' }}/Scrolless-Play-Debug.apk)**
          draft: false
          prerelease: false
          make_latest: true
          files: |
            release-apks/Scrolless-OSS-Release.apk
            release-apks/Scrolless-Play-Release.apk
            release-apks/Scrolless-OSS-Debug.apk
            release-apks/Scrolless-Play-Debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
